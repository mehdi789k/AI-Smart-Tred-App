groups:
  - name: smart-trader-operational
    rules:
      - alert: SmartTraderApiDown
        expr: up{job="smart-trader-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Smart Trader API is unavailable
          description: Prometheus cannot scrape the API replica.

      - alert: SmartTraderHttp5xxBurst
        expr: sum(rate(http_5xx_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Smart Trader API has elevated HTTP 5xx errors
          description: The API is returning more than 0.1 5xx responses per second.

      - alert: SmartTraderMt5Disconnected
        expr: max(mt5_health_configured) == 1 and min(mt5_connected) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MT5 connection is unavailable
          description: MT5 connectivity is unavailable on at least one API process.

      - alert: SmartTraderCircuitBreakerTripped
        expr: max(circuit_breaker_configured) == 1 and max(circuit_breaker_tripped) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Trading circuit breaker is tripped
          description: New orders must remain blocked until operator recovery.

      - alert: SmartTraderOrderRejections
        expr: sum(increase(order_rejections_total[5m])) >= 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Trading orders are being rejected
          description: One or more order requests were rejected by a safety gate.

      - alert: SmartTraderGatewayTimeouts
        expr: sum(increase(mt5_gateway_timeouts_total[5m])) >= 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MT5 execution gateway timed out
          description: The MT5 gateway did not acknowledge an execution request.

      - alert: SmartTraderStaleSignals
        expr: sum(increase(signal_stale_total[5m])) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Stale trading signals are being rejected
          description: Signals exceeded the freshness window and were blocked.

      - alert: SmartTraderDuplicateIdempotency
        expr: sum(increase(idempotency_duplicates_total[5m])) >= 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Duplicate order requests detected
          description: Idempotency prevented a repeated order request.

      - alert: SmartTraderDataGaps
        expr: sum(increase(data_gaps_total[5m])) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Market data gaps detected
          description: Missing nominal OHLCV periods were detected.

      - alert: SmartTraderUnknownOrders
        expr: |
          (max(unknown_orders_count) > 0)
          and on () (max(observability_source_available{source="order_state"}) == 1)
        labels:
          severity: critical
        annotations:
          summary: Unresolved order outcomes detected
          description: One or more orders have an unknown broker outcome and require reconciliation.

      - alert: SmartTraderCandleMissing
        expr: |
          (max by (symbol, timeframe) (candle_data_available) == 0)
          and on () (max(observability_source_available{source="market_data"}) == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Configured candle data is missing
          description: No persisted candle is available for {{ $labels.symbol }} {{ $labels.timeframe }}.

      - alert: SmartTraderCandleStale
        expr: |
          (
            max by (symbol, timeframe) (candle_data_age_seconds)
            > on (symbol, timeframe)
            max by (symbol, timeframe) (candle_stale_after_seconds)
          )
          and on (symbol, timeframe)
            (max by (symbol, timeframe) (candle_data_available) == 1)
          and on ()
            (max(observability_source_available{source="market_data"}) == 1)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Configured candle data is stale
          description: Candle data for {{ $labels.symbol }} {{ $labels.timeframe }} exceeded its configured age limit.

      - alert: SmartTraderCandleFreshnessUnconfigured
        expr: max(candle_freshness_configured) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Candle freshness monitoring is not configured
          description: Set OBS_CANDLE_MAX_AGE_SECONDS to monitor explicit symbol and timeframe pairs.

      - alert: SmartTraderObservabilitySourceUnavailable
        expr: observability_source_available{source=~"market_data|order_state"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An API replica cannot sample an operational data source
          description: The {{ $labels.source }} source is unavailable on API replica {{ $labels.instance }}.

      - alert: SmartTraderObservabilityCollectionErrors
        expr: sum(increase(observability_collection_errors_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Operational metric collection failed
          description: A database-backed operational metric collection failed in the last five minutes.
