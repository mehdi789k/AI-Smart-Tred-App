[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "data",
    "models",
    "logs",
    "ops/mt5/artifacts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src/python"]
exclude = [
    "src/python/mt5_account/",
    "src/python/dashboard/",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
allow_redefinition = true
