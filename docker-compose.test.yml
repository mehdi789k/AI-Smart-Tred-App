services:
  api:
    environment:
      MT5_AUTO_TRADING_ENABLED: "false"
      MT5_DASHBOARD_DIRECT: "false"
      MT5_LEGACY_ORDER_PATH_ENABLED: "false"
      MT5_LIVE_SYMBOLS: ""

  dashboard:
    environment:
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_TERMINAL_PATH: ${MT5_TERMINAL_PATH:-}
      MT5_AUTO_TRADING_ENABLED: ${MT5_AUTO_TRADING_ENABLED:-false}
      MT5_DASHBOARD_DIRECT: ${MT5_DASHBOARD_DIRECT:-false}
      MT5_LEGACY_ORDER_PATH_ENABLED: ${MT5_LEGACY_ORDER_PATH_ENABLED:-false}
