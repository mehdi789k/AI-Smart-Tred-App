services:
  timescaledb:
    image: timescale/timescaledb:2.13.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mt5_data}
      POSTGRES_USER: ${POSTGRES_USER:-mt5_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ml-training:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.ml
    profiles: ["training"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mt5_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-mt5_data}
      PYTHONUNBUFFERED: "1"
      MODEL_OUTPUT_DIR: /app/models
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./backtest_results:/app/backtest_results
    command: ["python", "scripts/train_model.py", "--source", "database", "--symbol", "XAUUSD", "--timeframe", "M5"]

  api:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mt5_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-mt5_data}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      MODEL_VERSION: ${MODEL_VERSION:-unreleased}
      MT5_LIVE_SYMBOLS: ${MT5_LIVE_SYMBOLS:-XAUUSD}
      MT5_AUTO_TRADING_ENABLED: ${MT5_AUTO_TRADING_ENABLED:-false}
      MT5_LEGACY_ORDER_PATH_ENABLED: ${MT5_LEGACY_ORDER_PATH_ENABLED:-false}
      MT5_DEMO_ENABLED: ${MT5_DEMO_ENABLED:-false}
      MT5_DASHBOARD_DIRECT: ${MT5_DASHBOARD_DIRECT:-false}
      ZMQ_EXECUTION_ENDPOINT: ${ZMQ_EXECUTION_ENDPOINT:-tcp://host.docker.internal:5555}
      OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:-}
      ORDER_AUDIT_RETENTION_DAYS: ${ORDER_AUDIT_RETENTION_DAYS:-90}
      BROKER_RESPONSE_RETENTION_DAYS: ${BROKER_RESPONSE_RETENTION_DAYS:-90}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

  dashboard:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.dashboard
    profiles: ["dashboard"]
    environment:
      API_BASE_URL: http://api:8000
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_TERMINAL_PATH: ${MT5_TERMINAL_PATH:-}
      MT5_AUTO_TRADING_ENABLED: ${MT5_AUTO_TRADING_ENABLED:-false}
      MT5_LEGACY_ORDER_PATH_ENABLED: ${MT5_LEGACY_ORDER_PATH_ENABLED:-false}
      MT5_DEMO_ENABLED: ${MT5_DEMO_ENABLED:-false}
      MT5_DASHBOARD_DIRECT: ${MT5_DASHBOARD_DIRECT:-false}
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  timescaledb_data:
  prometheus_data:
  alertmanager_data:
  grafana_data: